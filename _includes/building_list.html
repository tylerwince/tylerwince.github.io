<div class="app-list">
  {% assign apps = site.apps | sort: 'order' %}
  {% for app in apps %}
  <a class="app-card" href="{{ app.url | relative_url }}">
    {% if app.icon_path %}<img class="app-icon" src="{{ app.icon_path | relative_url }}" alt="" width="36" height="36" loading="lazy">{% else %}<span class="app-icon app-icon--letter" aria-hidden="true">{{ app.title | slice: 0, 1 }}</span>{% endif %}
    <span class="app-info">
      <span class="app-name">{{ app.title | escape }}</span>
      <span class="app-desc">{{ app.tagline | escape }}</span>
    </span>
    <span class="row-arrow" aria-hidden="true">↗</span>
  </a>
  {% endfor %}
</div>
